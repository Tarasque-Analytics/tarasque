# Daily data pipeline — scheduled run (PLAN §9.1).
#
# ⚠ SCAFFOLD / DISABLED. The pipeline is stubbed (no stage logic), so this workflow is
# manual-trigger only for now. When implementation lands and repo secrets are set, uncomment the
# `schedule` trigger to run nightly after US close.
#
# Required repo/Org secrets (Settings → Secrets and variables → Actions) — never commit these:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ALPACA_API_KEY, ALPACA_SECRET_KEY, ANTHROPIC_API_KEY
#
# NOTE: GitHub-hosted runners have NO GPU and a 6h job cap. The model's compute (XGBoost/RF over the
# universe) may not fit here — a likely reason to move scheduling to the backend host post-deploy
# (PLAN §9.1). Until then, prefer `--dry-run` here and run the model elsewhere.

name: daily-pipeline

on:
  workflow_dispatch:           # manual trigger (the only enabled trigger during scaffolding)
    inputs:
      dry_run:
        description: "Dry run (no external calls, no DB writes)"
        type: boolean
        default: true
  # schedule:
  #   # 22:00 UTC ≈ 6pm ET (EDT). Cron is UTC and does NOT observe US DST — revisit the offset, or
  #   # gate inside the orchestrator's business-date logic (PLAN §3.2).
  #   - cron: "0 22 * * 1-5"   # weekdays after US close

concurrency:
  # Never let two daily runs overlap; the pipeline is idempotent but concurrent writes are wasteful.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOMATION_ENV: stg
        run: |
          # During scaffolding, force dry-run regardless of input so no accidental writes occur.
          python -m automation --dry-run
          # When implemented, switch to:
          # python -m automation ${{ inputs.dry_run && '--dry-run' || '' }}
