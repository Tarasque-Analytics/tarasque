services:
  # Frontend - React Router app
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-http://backend:8000/api}
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5173
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - volarbmodel-network

  # Backend - Python/FastAPI app
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - volarbmodel-network
    volumes:
      - ./backend:/app/backend
      # Uncomment for development with auto-reload:
      # - ./automation:/app/automation

networks:
  volarbmodel-network:
    driver: bridge
